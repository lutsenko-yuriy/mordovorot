<!doctype html>
<!-- GH-147: loads the web game at phone sizes and reports whether it fits the window, or (report=styles,
     GH-156) every element's computed styles, or (report=keys, GH-174, keys.js) focus and the like after each
     of a list of keys, or (mode=offline, GH-262) whether the game opens and plays with no connection once the
     offline worker has cached it; update=ready (GH-262) first has the page find a new version. Served by serve.py and driven by measure.sh or styles_diff.sh; query options are in
     README.md. Results go to POST /result. -->
<meta charset="utf-8">
<style>iframe { border: 0; display: block; margin: 0 0 10px; }</style>
<pre id="out">pending</pre>
<div id="frames"></div>
<script src="keys.js"></script>
<script>
const q = new URLSearchParams(location.search);
const report = q.get("report") || "fit"; // fit | styles | keys | qr
// The keys report is about focus, not fit, so one case is enough.
const keys = report === "keys";
const PRESETS = {
    portrait: "320x568,375x667,390x844,393x852,412x915,430x932",
    // GH-148: the phones turned, plus the 14 and Pro Max less Safari's notch insets.
    landscape: "568x320,667x375,844x390,852x393,915x412,932x430,750x390,814x430",
};
const sizeList = q.get("sizes") || (keys ? "1200x800" : "portrait");
const sizes = (PRESETS[sizeList] || sizeList).split(",");
const boards = (q.get("boards") || (keys ? "4" : "3,4,5")).split(",").map(Number);
const mode = q.get("mode") || "play"; // play | dialog | share | solution | offline
// GH-262: update=ready has the page find a new version, which it takes a worker for.
const update = q.get("update") === "ready";
// GH-262: only this variant ships offline-worker.js (lib.sh).
const variant = mode === "offline" || update ? "with-worker" : q.get("v") || "mouse";
const shorter = Number(q.get("shorter") || 0);
const toolbarRows = Number(q.get("rows") || 1);
// GH-168: `scroll` lets larger text make the page taller than the window; see measure().
const fit = q.get("fit") || "window"; // window | scroll
// Mordie's longest line, so its spot is as tall as it gets.
const LONG = "Found one in 99 moves, but maybe there's a shorter one! Can you beat it?";
const wait = ms => new Promise(r => setTimeout(r, ms));
const round = r => r && `${Math.round(r.left)},${Math.round(r.top)}`;
const results = [];

/** A button's text as heard: a toolbar button's digit (GH-171) and a radio's mark are aria-hidden. */
const heardText = el => [...el.childNodes].filter(n => !n.getAttribute?.("aria-hidden")).map(n => n.textContent).join("").trim();

function clickText(doc, text) {
    const b = [...doc.querySelectorAll("button")].find(b => heardText(b) === text);
    if (b) b.click();
    return !!b;
}

/** One line: OK when the page is the window's size, nothing visible is past an edge, the toolbar has at
 *  most `rows` rows, the footer one line and the steps don't scroll sideways; then the sizes and positions
 *  to compare across runs. With fit=scroll (GH-168) the page may be taller than the window and rows may
 *  wrap, but nothing may be past a side or the page's top, every tile label must fit its tile, and
 *  tiles stay at least 16px. */
function measure(win, label) {
    const doc = win.document;
    const de = doc.documentElement;
    const rect = selector => doc.querySelector(selector)?.getBoundingClientRect();
    const toolbar = rect(".toolbar"), button = rect(".toolbar button"), footer = rect(".footer");
    const tiles = rect(".tiles"), tile = rect(".tile"), mordie = rect(".mordie"), panel = rect(".panel");
    // Past any of the window's four edges (GH-148). The arrows hidden on touch screens are 1px boxes
    // wherever they land, and a dialog's buttons scroll inside it, so neither counts; the dialog does.
    // With fit=scroll the top is the page's, not the window's: a page scrolled down isn't past it.
    const scrolled = fit === "scroll" ? win.scrollY : 0;
    let overflow = 0, culprit = "";
    for (const el of doc.querySelectorAll(".app button:not(.arrow):not(.dialog *), .footer, .status, .tiles, .steps, .dialog")) {
        const r = el.getBoundingClientRect();
        if (r.width === 0) continue;
        const bottom = fit === "scroll" ? -Infinity : r.bottom - win.innerHeight;
        const past = Math.max(bottom, r.right - de.clientWidth, -r.left, -(r.top + scrolled));
        if (past > overflow) { overflow = past; culprit = el.className || el.textContent; }
    }
    const steps = doc.querySelector(".steps");
    const sideways = steps ? steps.scrollWidth - steps.clientWidth : 0;
    const dialog = doc.querySelector(".dialog");
    const labelsOut = [...doc.querySelectorAll(".tile")]
        .filter(t => t.scrollWidth > t.clientWidth || t.scrollHeight > t.clientHeight).length;
    const fits = fit === "scroll"
        ? labelsOut === 0 && tile?.width >= 16
        : de.scrollHeight <= win.innerHeight && toolbar && button
            && toolbar.height < button.height * (toolbarRows + 0.5) && footer && footer.height < 30;
    // clientWidth, not innerWidth: a classic scrollbar, once the page scrolls, takes from the window (GH-168).
    const ok = fits && de.scrollWidth <= de.clientWidth && overflow <= 0.5 && sideways <= 0;
    return `${ok ? "OK  " : "BAD "}${label} page ${de.scrollWidth}x${de.scrollHeight} win ${win.innerWidth}x${win.innerHeight} `
        + `toolbar h${Math.round(toolbar?.height)} w${Math.round(toolbar?.width)}@${round(toolbar)} `
        + `footer h${Math.round(footer?.height)} tiles@${round(tiles)} tile ${Math.round(tile?.width)} `
        + `mordie h${Math.round(mordie?.height)}${panel?.height ? ` panel h${Math.round(panel.height)}` : ""}`
        + `${steps ? ` steps sideways ${sideways}` : ""}${dialog ? ` dialog h${dialog.clientHeight}/${dialog.scrollHeight}` : ""} `
        + `${fit === "scroll" ? `labels out ${labelsOut} ${scrolled ? `scrolled ${Math.round(scrolled)} ` : ""}` : ""}overflow ${Math.round(overflow)} ${culprit}`;
}

/** GH-243: draws the open Share dialog's QR code to a canvas, in the colours the page paints it, and
 *  has Chrome's BarcodeDetector read it back: `OK` when the text is the link field's. */
async function qrReadback(win, label) {
    if (!("BarcodeDetector" in window)) return `NO-DETECTOR ${label}`;
    const doc = win.document;
    const svg = doc.querySelector("svg.qr"), link = doc.querySelector("input[readonly]")?.value;
    if (!svg || !link) return `BAD ${label} no QR code in the dialog`;
    const markup = new XMLSerializer().serializeToString(svg)
        .replace("<svg", '<svg width="400" height="400" xmlns="http://www.w3.org/2000/svg"')
        .replace('class="qr-light"', `fill="${win.getComputedStyle(doc.querySelector(".qr-light")).fill}"`)
        .replace('class="qr-dark"', `fill="${win.getComputedStyle(doc.querySelector(".qr-dark")).fill}"`);
    const img = new Image();
    img.src = "data:image/svg+xml;base64," + btoa(markup);
    await img.decode();
    const canvas = document.createElement("canvas");
    canvas.width = canvas.height = 400;
    canvas.getContext("2d").drawImage(img, 0, 0, 400, 400);
    const read = (await new BarcodeDetector({ formats: ["qr_code"] }).detect(canvas)).map(b => b.rawValue);
    return `${read.length === 1 && read[0] === link ? "OK  " : "BAD "}${label} link ${link.length} chars, read ${JSON.stringify(read)}`;
}

/** Every element's computed styles, once the animations have finished: a dialog's fade caught partway
 *  differed between runs (GH-153). */
async function styles(win) {
    const doc = win.document;
    await Promise.race([Promise.all(doc.getAnimations().map(a => a.finished.catch(() => {}))), wait(5000)]);
    return [doc.documentElement, ...doc.documentElement.querySelectorAll("*")].map(el => {
        const style = win.getComputedStyle(el), props = {};
        for (const p of style) props[p] = style.getPropertyValue(p);
        return [el.tagName + [...el.classList].map(c => `.${c}`).join(""), props];
    });
}

/** GH-262: registers the offline worker, as the page will, and waits until it is active, which is when
 *  every file is cached; then the server answers 503 to everything, like a device with no connection. */
async function goOffline() {
    const reg = await navigator.serviceWorker.register(`/${variant}/offline-worker.js`, { scope: `/${variant}/` });
    for (let i = 0; i < 100 && reg.active?.state !== "activated"; i++) await wait(200);
    if (reg.active?.state !== "activated") return false;
    await fetch("/offline", { method: "POST" });
    return true;
}

/** One line for mode=offline: OK when the game opened from the cache, Mordie searched (his worker script
 *  came from the cache too) and Save/Load and Share opened. run() switches the network on again after. */
async function offlineReport(win, label) {
    const doc = win.document;
    const rendered = !!doc.querySelector(".tile");
    // Mordie lights Give Up once his search has found a solution, at a check every few shifts (as in
    // mode=solution); the search is the worker script, fetched from the cache.
    let searched = false;
    for (let i = 0; i < 80 && !searched; i++) {
        const arrows = [...doc.querySelectorAll(".arrow")];
        arrows[i % 2 ? 0 : arrows.length - 1]?.click();
        await wait(400);
        searched = doc.querySelector(".give-up button")?.disabled === false;
    }
    const opened = async button => {
        clickText(doc, button);
        await wait(300);
        const dialog = !!doc.querySelector(".dialog");
        clickText(doc, "Cancel") || clickText(doc, "OK") || doc.dispatchEvent(new KeyboardEvent("keydown", { key: "Escape" }));
        await wait(300);
        return dialog;
    };
    const save = await opened("Save"), share = await opened("Share");
    const ok = rendered && searched && save && share;
    return `${ok ? "OK  " : "BAD "}${label} offline: board ${rendered ? "rendered" : "MISSING"}, Mordie ${searched ? "searched" : "DID NOT SEARCH"}, Save ${save ? "opened" : "DID NOT OPEN"}, Share ${share ? "opened" : "DID NOT OPEN"}`;
}

/** GH-262: update=ready. The page registers the worker itself. Once it is active, the next worker script is a new
 *  version, and reloading finds it; the notice shows when every file of it is cached. */
async function findNewVersion(f) {
    const active = await Promise.race([f.contentWindow.navigator.serviceWorker.ready.then(() => true), wait(20000).then(() => false)]);
    if (!active) return false;
    await fetch("/next-version", { method: "POST" });
    await new Promise(r => { f.onload = r; f.contentWindow.location.reload(); });
    return true;
}

/** GH-262: mode=offline leaves the server answering 503, so whatever happens in the case, it is switched
 *  on again after; else one failure would time out every later query of the same run and hide itself. */
async function run(size, board) {
    try {
        await runCase(size, board);
    } finally {
        if (mode === "offline") await fetch("/online", { method: "POST" });
    }
}

async function runCase(size, board) {
    const [w, full] = size.split("x").map(Number);
    const h = full - shorter;
    if (mode === "offline" && !await goOffline()) {
        results.push(`BAD ${variant} offline ${w}x${h}: the worker never activated`);
        return;
    }
    const f = document.createElement("iframe");
    f.width = w;
    f.height = h;
    // Before the game reads them. input= and layout= (GH-171) are what an earlier visit would have left.
    localStorage.clear();
    if (q.get("input")) localStorage.setItem("mordovorot.pref.input_mode", q.get("input"));
    if (q.get("layout") === "left") localStorage.setItem("mordovorot.pref.keyboard_layout", "left_handed");
    // GH-251: saves= are solved 4x4 saves (the old text format), corrupt= entries nothing decodes.
    const named = key => (q.get(key) || "").split(",").filter(Boolean);
    for (const name of named("saves")) localStorage.setItem(`mordovorot.save.${name}`, `4\n${[...Array(16).keys()].join(" ")}\n0\n`);
    for (const name of named("corrupt")) localStorage.setItem(`mordovorot.save.${name}`, "not a save");
    const seeded = named("saves").length + named("corrupt").length > 0;
    f.src = `/${variant}/index.html`;
    document.getElementById("frames").append(f);
    await new Promise(r => f.onload = r);
    if (update && !await findNewVersion(f)) {
        results.push(`BAD ${variant} update ${w}x${h}: the page never registered a worker`);
        f.remove();
        return;
    }
    const win = f.contentWindow;
    await wait(400);
    // With saves, startup offers to restore one: Cancel it, unless restore=1 keeps that dialog (GH-251).
    const keepRestore = seeded && q.get("restore") === "1";
    if (seeded && !keepRestore) {
        clickText(win.document, "Cancel");
        await wait(300);
    }
    // With no saves, startup asks for a size.
    const pick = `${board}x${board}`;
    let picked = keepRestore || clickText(win.document, pick);
    if (!picked) {
        clickText(win.document, "New");
        await wait(200);
        picked = clickText(win.document, pick);
    }
    await wait(400);
    if (mode === "solution") {
        // Mordie reveals its solution at a check every 5 shifts, so keep shifting until Give Up lights up.
        for (let i = 0; i < 80 && win.document.querySelector(".give-up button")?.disabled !== false; i++) {
            const arrows = [...win.document.querySelectorAll(".arrow")];
            arrows[i % 2 ? 0 : arrows.length - 1]?.click();
            await wait(400);
        }
        clickText(win.document, "Give Up");
        await wait(300);
        clickText(win.document, "Yes");
        await wait(500);
    }
    const line = win.document.querySelector(".mordie .line");
    if (line && mode !== "offline") line.innerHTML = `<span class="name">Mordie:</span> ${LONG}`;
    if (mode === "dialog") {
        clickText(win.document, "Labels");
        await wait(300);
    }
    if (mode === "share") {
        clickText(win.document, "Share");
        await wait(300);
    }
    if (update) {
        for (let i = 0; i < 100 && !win.document.querySelector(".footer .update"); i++) await wait(200);
        await wait(100);
    }
    await wait(100);
    const solution = win.document.querySelector(".app.solution") ? " [solution]" : "";
    // GH-168: the root's font size, when --text-size or the page made it other than the standard 16px.
    // Not in a styles case's name, which pairs branch with master: their sizes may differ, and the
    // diff should show that as html's font-size, not as every case on one side only.
    const rootPx = parseFloat(win.getComputedStyle(win.document.documentElement).fontSize);
    const text = rootPx === 16 || report === "styles" ? "" : ` text ${rootPx}px`;
    const label = `${mode}${update ? " update" : ""} ${w}x${h} ${board}x${board}${solution}${text}`;
    if (mode === "offline") {
        results.push(await offlineReport(win, `${variant} ${label}`));
    } else if (report === "qr") {
        results.push(await qrReadback(win, `${variant} ${label}`));
    } else if (keys) {
        results.push(...await runKeys(win, (q.get("keys") || "").split(",").filter(Boolean), `${variant} ${label}`));
    } else if (report === "styles") {
        // One case per post keeps each body to about a megabyte.
        const body = JSON.stringify({ v: variant, case: label, elements: await styles(win) });
        await fetch("/result", { method: "POST", body });
    } else {
        results.push(measure(win, `${variant} ${label}`));
    }
    f.remove();
}

(async () => {
    for (const s of sizes) for (const b of boards) await run(s, b);
    document.getElementById("out").textContent = results.join("\n");
    await fetch("/result", { method: "POST", body: `# ${location.search}\n${results.join("\n")}\n#done` });
})();
</script>
